# Render blueprint for the ExamRoute API.
#
# Render → New → Blueprint → point at this repo. Everything below is
# reproducible; the four secrets marked `sync: false` are prompted for on
# first deploy and never live in the repo.
services:
  - type: web
    name: examroute-api
    runtime: node
    region: singapore # closest region to Indian users
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Generated by Render, so the deployed secret is never one a human
      # picked, typed into a chat window, or reused from another project.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Prompted on first deploy.
      - key: MONGO_URI
        sync: false
      # Must be the exact origin of the deployed frontend. CORS has no
      # wildcard fallback, so getting this wrong fails loudly at the browser
      # rather than quietly allowing everyone.
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # Optional integrations. Left unset, the server falls back to
      # straight-line distances, mock payments (hard-blocked in production),
      # and console-logged email — so a missing key degrades a feature
      # instead of breaking the deploy.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Fare, routing and cancellation parameters — business settings, so
      # they are visible here rather than buried in code.
      - key: FARE_PER_KM
        value: 3
      - key: BASE_FARE
        value: 100
      - key: MAX_SUBSIDY_PCT
        value: 50
      - key: SUBSIDY_PER_25KM
        value: 5
      - key: BUS_CAPACITY
        value: 40
      - key: SAFETY_BUFFER_MIN
        value: 60
      - key: GEOFENCE_RADIUS_KM
        value: 5
      - key: FULL_REFUND_HOURS
        value: 72
      - key: PARTIAL_REFUND_HOURS
        value: 24
      - key: PARTIAL_REFUND_PCT
        value: 50
